[project]
name = "clinic"
version = "0.1.0"
description = "Clinic appointment booking agent: booking service, Telegram bot and staff API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "phonenumbers>=9.0.42",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-telegram-bot[job-queue]>=22.8",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
clinic-api = "clinic.api.__main__:main"
clinic-bot = "clinic.bot.__main__:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers -m \"not live and not eval\""
markers = [
    "integration: needs the clinic_test schema on the configured database",
    "live: calls a real external service (Gemini, Telegram)",
    "eval: agent evaluation suite (real LLM, slow)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "RUF", "ASYNC", "PT", "TRY", "DTZ", "LOG", "G"]
# TRY400 (prefer logging.exception) is off on purpose: tracebacks carry exception messages and SQL
# parameters that can hold personal data. Errors are logged with clinic.observability.safe_exception_fields.
ignore = ["TRY003", "TRY400"]

[tool.ruff.lint.isort]
known-first-party = ["clinic", "seed"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "scripts"]
files = ["src", "tests", "migrations", "scripts"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
